name: CI Pipeline
'on':
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  node-build-test:
    name: Node.js Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Install Dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Run Tests
        run: npm test
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker Image
        run: docker build -t test-image .
  rls-integration-test:
    name: PostgreSQL RLS Isolation Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run RLS Isolation Test (proves tenant isolation with EXPLAIN ANALYZE)
        run: |
          chmod +x tests/e2e/test_rls_postgres.sh
          bash tests/e2e/test_rls_postgres.sh
      - name: Upload EXPLAIN ANALYZE output (RLS proof)
        uses: actions/upload-artifact@v4
        with:
          name: rls-explain-output
          path: explain_output.txt
          retention-days: 90
